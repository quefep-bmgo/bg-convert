[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bg-convert"
version = "0.1.0"
description = "Convert between Blockman GO maps and Minecraft Java worlds."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "quefep" }]
keywords = ["minecraft", "blockman-go", "nbt", "anvil", "converter"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
bgconvert = "bgconvert.cli:main"

[project.urls]
Homepage = "https://github.com/quefep-bmgo/bg-convert"

[tool.hatch.build.targets.wheel]
packages = ["src/bgconvert"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
